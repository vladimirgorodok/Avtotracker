name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Check core logic
        run: npm run smoke

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          AVTOBAZA_VERSION_CODE: ${{ github.run_number }}
          AVTOBAZA_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk avtobaza-debug.apk

      - name: Show signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs avtobaza-debug.apk | head -4
          else
            echo "apksigner не найден — подпись не проверена"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: avtobaza-apk
          path: avtobaza-debug.apk

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest avtobaza-debug.apk \
            --title "АвтоБаза (последняя сборка)" \
            --notes "Автоматическая сборка из ветки main, коммит ${GITHUB_SHA::7}, версия 1.0.${{ github.run_number }}. Ставится поверх предыдущей версии." \
            --prerelease

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" avtobaza-debug.apk --title "АвтоБаза $GITHUB_REF_NAME" --generate-notes
