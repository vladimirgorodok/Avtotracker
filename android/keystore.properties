# Ключ подписи АвтоБазы.
#
# Он лежит в репозитории намеренно: только один и тот же ключ подписи позволяет
# Android ставить новую версию поверх старой, не удаляя приложение и не стирая
# настройки. Подпись у приложения личная, в Play Market оно не публикуется,
# обновления никто не раздаёт автоматически — APK устанавливается вручную.
#
# Пароль и псевдоним ниже не являются секретами: сам файл ключа открыт.
storeFile=keystore/avtobaza.jks
storePassword=avtobaza-sign-2026
keyAlias=avtobaza
keyPassword=avtobaza-sign-2026
